spring:
  application:
    name: showszn-backend

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/showszn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:showszn}
    password: ${DB_PASSWORD:showszn}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER:https://YOUR-INSTANCE.clerk.accounts.dev}

app:
  admin-emails: ${ADMIN_EMAILS:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-address: ${RESEND_FROM_ADDRESS:ShowSzn <onboarding@resend.dev>}
  contact-email: ${CONTACT_EMAIL:nishant.singh7905096694@gmail.com}

server:
  port: ${PORT:8080}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
