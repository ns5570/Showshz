services:
  mysql:
    image: mysql:8.4
    container_name: showszn-mysql
    environment:
      MYSQL_DATABASE: showszn
      MYSQL_USER: showszn
      MYSQL_PASSWORD: showszn
      MYSQL_ROOT_PASSWORD: showszn
    ports:
      - "3306:3306"
    volumes:
      - showszn-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pshowszn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: showszn-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  showszn-mysql-data:
